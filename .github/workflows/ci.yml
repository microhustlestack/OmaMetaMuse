name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils

      - name: Run checks
        run: bash scripts/check.sh
